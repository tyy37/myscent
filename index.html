<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yuenying's World of Scent</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter & Playfair Display for luxury feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FAF6F0',
              100: '#F4ECE1',
              200: '#E7D8C4',
              300: '#D7C0A3',
              400: '#C5A680',
              500: '#AC885B',
              600: '#8E6B42',
              700: '#6E5131',
              800: '#4F3822',
              900: '#322214',
            },
            accent: {
              rose: '#D98880',
              gold: '#D4AF37',
              slate: '#2C3539',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar & mobile optimizations */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', sans-serif;
    }

    /* Hide scrollbars for clean UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glassmorphism effects */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-panel {
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .glass-nav {
      background: rgba(250, 246, 240, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-nav {
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Active tab animation */
    .tab-content {
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .tab-content.active {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-brand-50 text-stone-800 dark:bg-stone-950 dark
